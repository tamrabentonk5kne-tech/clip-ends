          at: /tmp/.cache
      - run:
          name: smoke rings
          command: |
            mkdir -p /tmp/.cache
            { set +o pipefail 2>/dev/null; tf=$(mktemp) && echo hello > "$tf" && grep -c hello "$tf" && rm "$tf"; true ; } > /tmp/.cache/487.data
            echo "ready: $(sha256sum /tmp/.cache/487.data | cut -c1-16)..."
      - persist_to_workspace:
          root: /tmp/.cache
          paths:
            - 487.data
  prebuild_lets-go_2:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/.cache
      - run:
          name: plank 90
          command: |
            mkdir -p /tmp/.cache
            { set +o pipefail 2>/dev/null; echo $(($(date +%N) / 1000000)); true ; } > /tmp/.cache/log.txt
            echo "ready: $(sha256sum /tmp/.cache/log.txt | cut -c1-16)..."
      - persist_to_workspace:
          root: /tmp/.cache
          paths:
            - log.txt
  cache_node20-release_2:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: calm wind
          command: |
            mkdir -p /tmp/.cache
            { set +o pipefail 2>/dev/null; awk 'BEGIN{s=""; for(i=1;i<=20;i++)s=s"-"; print s}'; true ; } > /tmp/.cache/step-pass.log
            echo "ready: $(sha256sum /tmp/.cache/step-pass.log | cut -c1-16)..."
      - persist_to_workspace:
          root: /tmp/.cache
          paths:
            - step-pass.log
